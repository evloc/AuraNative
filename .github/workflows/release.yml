# Builds AURA Native on a Windows machine and publishes it as a GitHub Release.
#
# To release:   git tag v0.1.0   then   git push origin v0.1.0
# (Or: GitHub -> Actions -> "Release AURA Native" -> Run workflow, for a test build
#  that is uploaded as an artifact but not published.)

name: Release AURA Native

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v", "V") } else { "0.0.0" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }
          "AURA_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building AURA Native $v"

      - name: Build
        shell: pwsh
        run: |
          dotnet build AuraNative.csproj -c Release -nologo "-p:Version=$env:AURA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the speech part (whisper.cpp)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git native\whisper.cpp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # one for newer processors (AVX2), one that runs on any 64-bit PC; AURA picks the right one
          cmake -S native -B build\fast -A x64 -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build\fast --config Release --target aura_whisper -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake -S native -B build\basic -A x64 -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF
          cmake --build build\basic --config Release --target aura_whisper -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\fast\Release\aura_whisper.dll "bin\Release\aura_whisper.dll"
          Copy-Item build\basic\Release\aura_whisper.dll "bin\Release\aura_whisper_basic.dll"
          Get-ChildItem bin\Release

      - name: Add the vocal part (onnxruntime)
        shell: pwsh
        run: |
          # onnxruntime's CPU build, taken from its official Python package (the same DLL Microsoft ships)
          python -m pip download onnxruntime==1.20.1 --no-deps --platform win_amd64 --only-binary=:all: --python-version 3.12 -d ort
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $whl = Get-ChildItem ort\*.whl | Select-Object -First 1
          Copy-Item $whl.FullName ort\w.zip; Expand-Archive ort\w.zip -DestinationPath ort\x -Force
          New-Item -ItemType Directory -Force "bin\Release\onnx" | Out-Null
          Copy-Item ort\x\onnxruntime\capi\onnxruntime.dll "bin\Release\onnx\"
          # the Visual C++ files it needs, next to it, so it works on PCs without them
          foreach ($f in "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll") { Copy-Item "C:\Windows\System32\$f" "bin\Release\onnx\" }
          Get-ChildItem bin\Release\onnx
          # the vocal model, so the self-test can run it once
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force "$env:APPDATA\AURA Native\models" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx" -OutFile "$env:APPDATA\AURA Native\models\UVR-MDX-NET-Voc_FT.onnx"

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "bin\Release\AURA Native.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\AURA Native\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build the installer and a no-install copy
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:AURA_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "bin\Release\AURA Native.exe","bin\Release\AURA Native.exe.config","bin\Release\aura_whisper.dll","bin\Release\aura_whisper_basic.dll","bin\Release\onnx" -DestinationPath "dist\AURA-Native-portable.zip"

      - name: Keep the files from a test run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Native-${{ env.AURA_VERSION }}
          path: |
            dist/AURA-Native-Setup.exe
            dist/AURA-Native-portable.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AURA Native ${{ env.AURA_VERSION }}
          generate_release_notes: true
          files: |
            dist/AURA-Native-Setup.exe
            dist/AURA-Native-portable.zip
